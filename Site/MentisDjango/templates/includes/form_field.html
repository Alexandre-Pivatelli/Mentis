{# Padroniza a apresentação de rótulo, campo, ajuda e erros dos formulários. #}
<div class="input-group">
  {{ field.label_tag }}
  {{ field }}
  {% if field.help_text %}
  <div class="field-help" id="{{ field.auto_id }}_helptext">
    {{ field.help_text }}
  </div>
  {% endif %}
  {{ field.errors }}
</div>
